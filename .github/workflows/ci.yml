name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build release PWA using public configuration only
        run: flutter build web --release --no-pub --pwa-strategy offline-first --dart-define-from-file=config/staging.public.json
      - name: Generate and validate static-shell worker
        run: |
          node scripts/generate-shell-worker.mjs build/web
          node --test scripts/pwa/*.test.mjs

  backup-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: BACKUP_DOCKER_TEST=1 python3 -m unittest discover -s scripts/backup -v
      - name: Test pinned AWS CLI against loopback fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-cli"
          "$RUNNER_TEMP/backup-cli/bin/pip" install 'awscli==1.36.40'
          PATH="$RUNNER_TEMP/backup-cli/bin:$PATH" BACKUP_CLI_TEST=1 python3 -m unittest discover -s scripts/backup -p test_cli_integration.py -v

  scripts-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.8'
      - run: node --test scripts/*test.mjs supabase/tests/*.test.mjs
      - name: Test Edge Function units (no runtime permissions)
        run: deno test supabase/functions/ --ignore=supabase/functions/storage-upload-url/signing_test.ts
      - name: Check locked storage function entrypoints
        run: |
          deno check --frozen --config supabase/functions/storage-upload-url/deno.json supabase/functions/storage-upload-url/index.ts supabase/functions/storage-upload-url/storage_test.ts supabase/functions/storage-upload-url/signing_test.ts
          deno check --frozen --config supabase/functions/storage-download-url/deno.json supabase/functions/storage-download-url/index.ts
      - name: Test locked S3 signing (no network runtime permissions)
        run: deno test --frozen --config supabase/functions/storage-upload-url/deno.json '--allow-env=AWS_*,SMITHY_*,HOME,USERPROFILE,HOMEPATH,HOMEDRIVE,_X_AMZN_TRACE_ID' --allow-sys=osRelease supabase/functions/storage-upload-url/signing_test.ts
