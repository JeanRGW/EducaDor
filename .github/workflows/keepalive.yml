name: Database keepalive (manual)

# Scheduling requires an explicit operator-reviewed follow-up change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-keepalive
  cancel-in-progress: false

jobs:
  read:
    if: github.ref == 'refs/heads/main'
    environment: database-keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Read one database row without logging data
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keepalive.mjs
