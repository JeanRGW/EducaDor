name: Database

on:
  pull_request:
    paths: ['supabase/**', 'scripts/db.sh', '.github/workflows/database.yml']
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/db.sh', '.github/workflows/database.yml']

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start database and test additive profile rollout stage
        run: |
          restriction=supabase/migrations/20261112053550_profile_restrict.sql
          mv "$restriction" "$RUNNER_TEMP/profile_restrict.sql"
          trap 'mv "$RUNNER_TEMP/profile_restrict.sql" "$restriction"' EXIT
          npx --yes supabase@2.122.0 db start
          docker exec -i supabase_db_EducaDor psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/profile_privacy_additive.sql.stage
      - name: Rebuild from migrations
        run: bash scripts/db.sh reset
      - name: Check declarative schema matches migrations
        run: bash scripts/db.sh check
      - name: Run SQL regression tests
        run: bash scripts/db.sh test
      - name: Test invitation handler
        run: node --test supabase/tests/invite_member.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Test push sender without permissions
        run: deno test supabase/functions/push-on-assign/push_test.ts
      - name: Typecheck push function
        run: deno check supabase/functions/push-on-assign/index.ts
      - name: Stop local database
        if: always()
        run: npx --yes supabase@2.122.0 stop --no-backup
